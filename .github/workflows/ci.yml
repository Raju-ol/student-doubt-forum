name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Test
        run: npm test 2>&1 | tee test-output.txt
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017
          JWT_SECRET: ci-only-secret-at-least-thirty-two-characters-long
      # Job logs need a token to read, so the failing output is also raised as
      # an annotation and kept as an artifact, both readable without one.
      - name: Report failing tests
        if: failure()
        run: |
          echo "::error::$(grep -a -A4 'failing tests' test-output.txt | head -c 2000 | tr -d '\r' | tr '\n' ' ' | sed 's/::/;;/g')"
      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high
